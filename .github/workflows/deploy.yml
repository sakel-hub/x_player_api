name: Test, Lint and Deploy to ContentDB

on:
  push:
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      title:
        description: 'Release title / tag'
        required: false
        default: 'v1.1.3'

jobs:
  test_and_lint:
    uses: ./.github/workflows/luacheck.yml

  deploy:
    name: Deploy to ContentDB
    needs: test_and_lint
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Deploy to ContentDB
        env:
          CONTENT_DB_X_PLAYER_API_TOKEN: ${{ secrets.CONTENT_DB_X_PLAYER_API_TOKEN }}
          CONTENT_DB_TOKEN: ${{ secrets.CONTENT_DB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TITLE="${{ github.ref_name }}"
            RELEASE_REF="${{ github.ref_name }}"
          else
            RELEASE_TITLE="${{ inputs.title }}"
            RELEASE_REF="${{ github.ref_name }}"
          fi
          TOKEN="${CONTENT_DB_X_PLAYER_API_TOKEN:-$CONTENT_DB_TOKEN}"
          echo "Deploying release '$RELEASE_TITLE' (ref: $RELEASE_REF) to ContentDB..."
          npm run push:ci -- --token="$TOKEN" --title="$RELEASE_TITLE" --ref="$RELEASE_REF"
